# Nominal paper-model assumption; not an empirical AGV specification.
# SS-compensated WPT under the fundamental-harmonic approximation (FHA).
coil_geometry:
  outer_side_m: 0.300
  inner_side_m: 0.100
  turns: 15
  air_gap_m: 0.040
  segments_per_side: 16

resonant_network:
  frequency_hz: 85000.0
  coil_resistance_ohm: 0.150

dc_side:
  dc_output_voltage_v: 48.0
  rated_output_power_kw: 3.0
  rectifier_fha_factor: 0.8105694691387022  # 8 / pi^2
  rectifier_convention: full-wave/full-bridge FHA equivalent load
  nominal_matched_load_ohm: 0.6225173523  # (8/pi^2) * 48^2 / 3000

final_des_assumption:
  topology: power_supply -> inverter -> Tx -> Rx -> rectifier -> DC_link -> CCCV_buck -> battery
  eta_model: eta(delta) at nominal 3-kW SS-FHA matched operation
  load_regulation: CCCV duty regulation is simplified as near-matched resonant-link operation over the DES charging range.
  out_of_scope: Detailed CCCV switching/control dynamics and an explicit effective-load trajectory are not modeled.
