# Active rho-redesign/tuning source of truth. Physical parameters are in wpt_model.yaml.
seeds:
  tuning_start: 5007
  tuning_end: 5056
  replications: 50

c4_four_feature:
  feature_names: [soc, next_task_energy, idle, deadline]
  score: "soc*f_SOC + next_task_energy*f_E + idle*f_idle - deadline*f_D"
  coarse_simplex_step: 0.25
  local_simplex_step: 0.05

c5_revalidation:
  current_scales: [2.0, 1.5, 1.5]
  oat_values:
    lambda_soc: [1.5, 2.0, 2.5]
    lambda_task: [1.0, 1.5, 2.0]
    lambda_kpi: [1.0, 1.5, 2.0]
  horizon_s: 900.0
  slot_s: 60.0

scenarios:
  base:
    role: non_binding_reference
    n_agvs: 5
    n_pads: 2
    task_arrival_rate_per_h: 75
    wpt_power_kw: 3
    distances_m: [30, 30, 30, 30, 30]
    urgent_ratio: 0.0
  primary_candidate_current:
    role: legacy_comparator
    n_agvs: 5
    n_pads: 1
    task_arrival_rate_per_h: 90
    wpt_power_kw: 3
    distances_m: [20, 25, 30, 35, 40]
    urgent_ratio: 0.2
  primary_candidate_60m:
